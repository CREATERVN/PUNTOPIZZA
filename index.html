<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punto Pizza Ica</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family: 'Segoe UI', Arial;
  background:#0d0d0d;
  color:white;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  padding:20px;
  background:black;
  border-bottom:2px solid red;
}

.logo{
  font-size:24px;
  font-weight:bold;
}
.logo span{color:red;}

nav a{
  color:white;
  margin:10px;
  text-decoration:none;
  font-weight:bold;
}
nav a:hover{color:red;}

/* HERO MEJORADO */
.hero{
  background:url("local-1.jpg") center/cover;
  height:500px;
  display:flex;
  align-items:center;
  padding:60px;
  position:relative;
}

/* overlay oscuro */
.hero::before{
  content:"";
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.6);
}

.hero-content{
  position:relative;
  z-index:2;
}

.hero h1{
  font-size:55px;
  text-shadow:2px 2px 10px black;
}
.hero span{color:red;}

.btn{
  display:inline-block;
  margin-top:20px;
  padding:12px 25px;
  background:red;
  color:white;
  text-decoration:none;
  border-radius:5px;
}

/* SECCIONES */
.section{
  padding:60px 40px;
  text-align:center;
}

.cards{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}

.card{
  background:#1a1a1a;
  margin:15px;
  padding:20px;
  border-radius:12px;
  width:280px;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
}

.card img{
  width:100%;
  border-radius:10px;
  cursor:pointer;
}

/* GALERIA PROMOS */
.galeria img{
  width:250px;
  margin:10px;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
}

.galeria img:hover{
  transform:scale(1.1);
}

/* LIGHTBOX */
.lightbox{
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
}

.lightbox img{
  max-width:90%;
  max-height:90%;
}

/* FOOTER */
footer{
  background:black;
  padding:20px;
  text-align:center;
}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:green;
  padding:15px;
  border-radius:50%;
  text-decoration:none;
  font-size:20px;
}
</style>
</head>

<body>

<header>
<div class="logo">🍕 Punto <span>Pizza</span></div>
<nav>
<a href="#">Inicio</a>
<a href="#locales">Locales</a>
<a href="#promos">Promos</a>
<a href="#contacto">Contacto</a>
</nav>
</header>

<!-- HERO -->
<section class="hero">
<div class="hero-content">
<h1>La mejor <span>pizza</span> de Ica</h1>
<p>Calidad, sabor y delivery rápido</p>
<a class="btn" href="https://wa.me/51979104910">Pedir ahora</a>
</div>
</section>

<!-- LOCALES -->
<section id="locales" class="section">
<h2>Nuestras Sucursales</h2>

<div class="cards">
<div class="card">
<img src="local-1.jpg" onclick="openImg(this.src)">
<h3>Todos nuestros locales</h3>
<p>Presencia en distintos puntos de Ica</p>
</div>
</div>

</section>

<!-- PROMOCIONES -->
<section id="promos" class="section galeria">
<h2>Promociones</h2>

<img src="promo-1.jpg" onclick="openImg(this.src)">
<img src="promo-2.jpg" onclick="openImg(this.src)">
<img src="promo-3.jpg" onclick="openImg(this.src)">
<img src="promo-4.jpg" onclick="openImg(this.src)">
<img src="promo-5.jpg" onclick="openImg(this.src)">

</section>

<!-- UBICACIÓN -->
<section class="section">
<h2>Ubicación</h2>

<iframe 
src="https://www.google.com/maps?q=Las+Nieves+101+Ica&output=embed"
width="100%" height="300">
</iframe>

</section>

<!-- CONTACTO -->
<section id="contacto" class="section">
<h2>Contacto</h2>
<p>📞 979 104 910</p>
<p>Ica, Perú</p>
</section>

<footer>
© 2026 Punto Pizza Ica
</footer>

<a class="whatsapp" href="https://wa.me/51979104910">💬</a>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="this.style.display='none'">
<img id="lightbox-img">
</div>

<script>
function openImg(src){
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lightbox-img").src = src;
}
</script>

</body>
</html>
