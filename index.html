<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punto Pizza Ica PRO</title>

<!-- FUENTES -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<!-- ICONOS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Poppins', sans-serif;
  background:#0d0d0d;
  color:white;
}

/* HEADER */
.header{
  position:sticky;
  top:0;
  display:flex;
  justify-content:space-between;
  padding:15px 40px;
  background:linear-gradient(90deg,#000,#330000);
  z-index:1000;
}

.logo b{color:#ff2b2b;}

nav a{
  color:white;
  margin-left:25px;
  text-decoration:none;
}

/* SLIDER */
.slider{
  position:relative;
  height:400px;
  overflow:hidden;
}

.slide{
  position:absolute;
  width:100%;
  height:100%;
  opacity:0;
  transition:1s;
}

.slide.active{opacity:1;}

.slide img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* SECCIONES */
.section{
  padding:60px;
  text-align:center;
}

.fade{
  opacity:0;
  transform:translateY(40px);
  transition:1s;
}

.fade.show{
  opacity:1;
  transform:translateY(0);
}

/* MENÚ */
.menu{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}

.item{
  background:white;
  color:black;
  margin:15px;
  padding:15px;
  width:220px;
  border-radius:10px;
}

.item img{
  width:100%;
  border-radius:10px;
}

.price{
  color:red;
  font-weight:bold;
}

/* BOTÓN */
.btn{
  background:red;
  color:white;
  padding:10px 20px;
  border:none;
  cursor:pointer;
}

/* PEDIDO */
.cart{
  position:fixed;
  bottom:20px;
  left:20px;
  background:white;
  color:black;
  padding:15px;
  border-radius:10px;
}

/* PROMOS */
.galeria img{
  width:200px;
  margin:10px;
  border-radius:10px;
}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  padding:15px;
  border-radius:50%;
}
</style>
</head>

<body>

<header class="header">
<h2>Punto <b>Pizza</b></h2>
<nav>
<a href="#">Inicio</a>
<a href="#menu">Menú</a>
<a href="#promos">Promos</a>
</nav>
</header>

<!-- SLIDER -->
<div class="slider">
<div class="slide active"><img src="promo-1.jpg"></div>
<div class="slide"><img src="promo-2.jpg"></div>
<div class="slide"><img src="promo-3.jpg"></div>
</div>

<!-- MENÚ -->
<section id="menu" class="section fade">
<h2>🍕 Menú</h2>

<div class="menu">

<div class="item">
<img src="promo-1.jpg">
<h3>Pizza Familiar</h3>
<p class="price">S/ 35</p>
<button class="btn" onclick="add()">Agregar</button>
</div>

<div class="item">
<img src="promo-2.jpg">
<h3>Pizza Mediana</h3>
<p class="price">S/ 25</p>
<button class="btn" onclick="add()">Agregar</button>
</div>

<div class="item">
<img src="promo-3.jpg">
<h3>Pizza Personal</h3>
<p class="price">S/ 15</p>
<button class="btn" onclick="add()">Agregar</button>
</div>

</div>
</section>

<!-- PROMOS -->
<section id="promos" class="section fade">
<h2>🔥 Promociones</h2>

<div class="galeria">
<img src="promo-1.jpg">
<img src="promo-2.jpg">
<img src="promo-3.jpg">
<img src="promo-4.jpg">
<img src="promo-5.jpg">
</div>

</section>

<!-- CARRITO -->
<div class="cart">
🛒 Pedidos: <span id="count">0</span>
</div>

<a class="whatsapp" href="https://wa.me/51979104910"><i class="fa-brands fa-whatsapp"></i></a>

<script>

/* SLIDER */
let slides=document.querySelectorAll(".slide");
let i=0;

setInterval(()=>{
  slides[i].classList.remove("active");
  i=(i+1)%slides.length;
  slides[i].classList.add("active");
},3000);

/* SCROLL ANIMATION */
let faders=document.querySelectorAll(".fade");

window.addEventListener("scroll",()=>{
  faders.forEach(el=>{
    let top=el.getBoundingClientRect().top;
    if(top<window.innerHeight-100){
      el.classList.add("show");
    }
  });
});

/* PEDIDOS */
let count=0;
function add(){
  count++;
  document.getElementById("count").innerText=count;
}

</script>

</body>
</html>
