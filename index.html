<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punto Pizza Ica</title>

<!-- TIPOGRAFÍA (con respaldo) -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Poppins', Arial, sans-serif; /* respaldo incluido */
  background:#0d0d0d;
  color:white;
}

/* HEADER MEJORADO (CAMBIO MUY NOTORIO) */
.header{
  position:sticky;
  top:0;
  z-index:1000;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;

  /* 🔥 CAMBIO VISUAL FUERTE */
  background:linear-gradient(90deg,#000000,#330000);
  box-shadow:0 5px 20px rgba(255,0,0,0.4);
}

.logo{
  display:flex;
  align-items:center;
  font-size:24px;
  font-weight:700;
}

.logo .icon{
  font-size:28px;
  margin-right:10px;
}

.logo b{
  color:#ff2b2b;
}

/* NAV */
nav a{
  position:relative;
  color:white;
  margin-left:30px;
  text-decoration:none;
  font-weight:600;
  transition:0.3s;
}

nav a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-6px;
  width:0%;
  height:2px;
  background:#ff2b2b;
  transition:0.3s;
}

nav a:hover{
  color:#ff2b2b;
}

nav a:hover::after{
  width:100%;
}

/* HERO */
.hero{
  background:linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)), url("local-1.jpg") center/cover;
  height:500px;
  display:flex;
  align-items:center;
  padding:60px;
}

.hero h1{
  font-size:60px;
}

.hero span{color:#ff2b2b;}

.hero p{
  margin-top:10px;
  font-size:18px;
}

.btn{
  display:inline-block;
  margin-top:25px;
  padding:14px 30px;
  background:#ff2b2b;
  color:white;
  text-decoration:none;
  border-radius:6px;
  transition:0.3s;
}

.btn:hover{
  background:#ff0000;
  transform:scale(1.05);
}

/* SECCIONES */
.section{
  padding:70px 40px;
  text-align:center;
}

.section h2{
  margin-bottom:30px;
  font-size:32px;
}

/* CARDS */
.cards{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}

.card{
  background:#1a1a1a;
  margin:15px;
  padding:20px;
  border-radius:12px;
  width:280px;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-8px);
  box-shadow:0 10px 25px rgba(255,0,0,0.3);
}

.card img{
  width:100%;
  border-radius:10px;
  cursor:pointer;
}

/* GALERIA */
.galeria img{
  width:250px;
  margin:10px;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
}

.galeria img:hover{
  transform:scale(1.1);
}

/* LIGHTBOX */
.lightbox{
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.95);
  justify-content:center;
  align-items:center;
}

.lightbox img{
  max-width:90%;
  max-height:90%;
}

/* FOOTER */
footer{
  background:black;
  padding:25px;
  text-align:center;
}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  padding:15px;
  border-radius:50%;
  font-size:22px;
  text-decoration:none;
}
</style>
</head>

<body>

<header class="header">
<div class="logo">
<span class="icon">🍕</span>
<span>Punto <b>Pizza</b></span>
</div>

<nav>
<a href="#">Inicio</a>
<a href="#locales">Locales</a>
<a href="#promos">Promos</a>
<a href="#contacto">Contacto</a>
</nav>
</header>

<section class="hero">
<div>
<h1>La mejor <span>pizza</span> de Ica</h1>
<p>Calidad, sabor y delivery rápido</p>
<a class="btn" href="https://wa.me/51979104910">Pedir ahora</a>
</div>
</section>

<section id="locales" class="section">
<h2>Nuestras Sucursales</h2>

<div class="cards">
<div class="card">
<img src="local-1.jpg" onclick="openImg(this.src)">
<h3>Todos nuestros locales</h3>
<p>Encuéntranos en distintos puntos de Ica</p>
</div>
</div>

</section>

<section id="promos" class="section galeria">
<h2>Promociones</h2>

<img src="promo-1.jpg" onclick="openImg(this.src)">
<img src="promo-2.jpg" onclick="openImg(this.src)">
<img src="promo-3.jpg" onclick="openImg(this.src)">
<img src="promo-4.jpg" onclick="openImg(this.src)">
<img src="promo-5.jpg" onclick="openImg(this.src)">

</section>

<section class="section">
<h2>Ubicación</h2>

<iframe 
src="https://www.google.com/maps?q=Las+Nieves+101+Ica&output=embed"
width="100%" height="300">
</iframe>

</section>

<section id="contacto" class="section">
<h2>Contacto</h2>
<p>📞 979 104 910</p>
<p>Ica, Perú</p>
</section>

<footer>
© 2026 Punto Pizza Ica
</footer>

<a class="whatsapp" href="https://wa.me/51979104910">💬</a>

<div class="lightbox" id="lightbox" onclick="this.style.display='none'">
<img id="lightbox-img">
</div>

<script>
function openImg(src){
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lightbox-img").src = src;
}
</script>

</body>
</html>
